<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水豚温泉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3d4a5c;
    --cream: #fffaf1;
    --display: "ZCOOL KuaiLe", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.5 "Microsoft YaHei UI", "PingFang SC", sans-serif; color: var(--ink);
    background:
      radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.55), transparent 60%),
      repeating-conic-gradient(#e7f0f7 0 25%, #f4f8fb 0 50%) 0 0 / 44px 44px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  #stage { display: flex; align-items: flex-start; gap: 26px; }
  #cardCol { position: relative; display: flex; flex-direction: column; align-items: center; }

  /* 包装上的挂孔和标签 */
  .hanger { width: 64px; height: 20px; border-radius: 12px; background: #dfe8ef; box-shadow: inset 0 2px 4px rgba(0,0,0,.18); margin-bottom: -8px; position: relative; z-index: 3; }
  #card { position: relative; background: #fff; border-radius: 26px; padding: 14px; box-shadow: 0 30px 60px rgba(40,70,100,.22), 0 6px 14px rgba(40,70,100,.12); }
  #scene { position: relative; border-radius: 16px; overflow: hidden; background: #eef1f4; touch-action: none; }
  #scene > img.bg { display: block; width: 100%; height: 100%; pointer-events: none; }
  .label {
    position: absolute; left: 34px; top: 30px; z-index: 900; pointer-events: none;
    background: var(--cream); border-radius: 18px; padding: 12px 20px 12px 18px;
    box-shadow: 0 0 0 5px #fff, 0 0 0 6.5px #d8d0c4, 0 8px 16px rgba(0,0,0,.12);
  }
  .label h1 { margin: 0; font: 34px/1.05 var(--display); letter-spacing: 2px; color: #35506e; }
  .label h1 b { color: #e0795e; font-weight: normal; }
  .label p { margin: 6px 0 0; font: 15px var(--display); color: #6a86a3; letter-spacing: 1px; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-top: 14px; width: 100%; padding: 0 8px; }
  #count { font: 18px var(--display); color: #4f6a86; flex: 1; }
  .tb { border: 0; background: #fff; color: #4f6a86; font: 15px var(--display); padding: 7px 14px 6px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 0 #cfdbe6, 0 4px 10px rgba(40,70,100,.1); }
  .tb:hover { background: #f5faff; }
  .tb:active { transform: translateY(2px); box-shadow: 0 0 0 #cfdbe6; }
  .tb.main { background: #e0795e; color: #fff; box-shadow: 0 2px 0 #b95c44, 0 4px 10px rgba(180,90,60,.2); }

  /* ---------- 贴纸 ---------- */
  .stk { position: absolute; transform-origin: 50% 90%; cursor: grab; touch-action: none;
    filter: drop-shadow(0 2px 1.5px rgba(40,60,80,.22)) drop-shadow(0 5px 6px rgba(40,60,80,.12)); }
  .stk.landed { animation: stick .5s cubic-bezier(.25,1.45,.45,1) both; }
  .stk.lifting { opacity: 0; }
  .stk.peeloff { animation: peeloff .4s ease-in forwards; }
  .in { position: relative; width: 100%; height: 100%; }
  .in img { display: block; width: 100%; height: 100%; pointer-events: none; }
  /* PET 贴纸的反光 */
  .in::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.75) 47%, rgba(255,255,255,.2) 52%, transparent 60%) no-repeat;
    background-size: 300% 100%; background-position: 150% 0;
    -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
    mix-blend-mode: screen; opacity: .9; animation: sheen 9s ease-in-out var(--sd, 2s) infinite;
  }
  @keyframes stick {
    0% { transform: translateY(-14px) rotate(-3deg) scale(1.08); filter: drop-shadow(0 16px 10px rgba(40,60,80,.25)); }
    55% { transform: translateY(2px) rotate(.8deg) scale(.97); }
    80% { transform: translateY(-1px) scale(1.01); }
    100% { transform: none; }
  }
  @keyframes peeloff { to { opacity: 0; transform: translateY(-30px) rotate(-10deg) scale(1.1); } }
  @keyframes sheen { 0%, 78% { background-position: 150% 0; } 92%, 100% { background-position: -60% 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.8%) rotate(.8deg); } }
  @keyframes bob2 { 0%, 100% { transform: translateY(-1%) rotate(-.6deg); } 50% { transform: translateY(1.2%) rotate(.6deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012, .988); } }
  @keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }

  /* 手里捏着的贴纸 */
  #hand { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; display: none;
    filter: drop-shadow(0 18px 14px rgba(40,60,80,.28)) drop-shadow(0 4px 4px rgba(40,60,80,.15)); transition: opacity .15s; }
  #hand .in::after { animation: none; background-position: 30% 0; opacity: .5; }
  #hand.back { opacity: .8; }
  .spark { position: fixed; width: 7px; height: 7px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff6c2; box-shadow: 0 0 6px #ffe27a; pointer-events: none; z-index: 1001; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--tx), var(--ty)) scale(.2); opacity: 0; } }

  /* ---------- 贴纸页 ---------- */
  #sheet {
    position: relative; margin-top: 20px; border-radius: 22px; padding: 14px 14px 12px; display: flex; flex-direction: column;
    background: repeating-conic-gradient(#e6f0f8 0 25%, #fbfdff 0 50%) 0 0 / 26px 26px;
    box-shadow: 0 0 0 6px #fff, 0 20px 40px rgba(40,70,100,.2), 0 4px 10px rgba(40,70,100,.1);
  }
  #sheet::before { content: ""; position: absolute; inset: 0; border-radius: 22px; pointer-events: none; z-index: 2;
    background: linear-gradient(125deg, rgba(255,255,255,.55), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 70%, rgba(255,255,255,.3)); }
  .sheetHd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; position: relative; z-index: 3; }
  .sheetHd b { flex: 1; font: 20px var(--display); font-weight: normal; color: #35506e; }
  .sheetHd small { font: 12px var(--display); color: #7d97b0; display: block; }
  .arrow { width: 32px; height: 32px; border: 0; border-radius: 50%; background: #fff; color: #4f6a86; font: 18px/1 var(--display); cursor: pointer; box-shadow: 0 2px 0 #cfdbe6; }
  .arrow:hover { background: #f5faff; }
  #slots { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
  .slot { display: flex; align-items: center; justify-content: center; }
  .slot.wide { grid-column: span 2; }
  .onsheet { position: relative; cursor: grab; touch-action: none; transition: transform .15s;
    filter: drop-shadow(0 1.5px 1px rgba(40,60,80,.25)) drop-shadow(0 3px 4px rgba(40,60,80,.1)); }
  .onsheet:hover { transform: translateY(-3px) rotate(-1.5deg); }
  /* 撕走以后留下的模切孔 */
  .hole { background: rgba(120,150,180,.18); -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; }
  #pageDots { display: flex; justify-content: center; gap: 8px; margin-top: 8px; position: relative; z-index: 3; }
  #pageDots i { width: 10px; height: 10px; border-radius: 50%; background: #cfdbe6; cursor: pointer; }
  #pageDots i.on { background: #e0795e; }
  #pageDots i.done:not(.on) { background: #9cc9a0; }

  /* ---------- 热气、水光、雪、灯光 ---------- */
  .fx { position: absolute; pointer-events: none; }
  .steam { width: 8.5%; aspect-ratio: 1.2; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 55%, rgba(255,255,255,1) 0%, rgba(255,255,255,.85) 30%, rgba(236,246,252,.35) 55%, rgba(255,255,255,0) 72%);
    filter: blur(5px) drop-shadow(0 0 3px rgba(140,175,200,.35)); opacity: 0; animation: steam var(--t, 6s) ease-out var(--sd, 0s) infinite; }
  @keyframes steam { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 25% { opacity: .55; } 60% { opacity: .38; } 100% { opacity: 0; transform: translate(var(--dx, 10px), -190%) scale(1.7); } }
  .glint { width: 3.6%; height: .9%; border-radius: 50%; background: rgba(255,255,255,.9); filter: blur(.6px); opacity: 0; animation: glint 3.2s ease-in-out var(--sd, 0s) infinite; }
  @keyframes glint { 0%, 100% { opacity: 0; transform: scaleX(.4); } 40% { opacity: .9; transform: scaleX(1); } 70% { opacity: 0; transform: scaleX(1.4); } }
  #snow { position: absolute; overflow: hidden; pointer-events: none; }
  #snow i { position: absolute; top: -4%; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: .9; animation: snow var(--t, 7s) linear var(--sd, 0s) infinite; }
  @keyframes snow { to { transform: translate(var(--dx, -20px), var(--fall, 300px)); } }
  .glow { border-radius: 50%; background: radial-gradient(circle, rgba(255,214,140,.55), rgba(255,214,140,0) 65%); animation: glow 3.5s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  #sunbeam { position: absolute; inset: 0; pointer-events: none; z-index: 5; mix-blend-mode: screen; opacity: .5;
    background: linear-gradient(200deg, rgba(235,246,255,.75) 0%, rgba(235,246,255,.25) 45%, rgba(235,246,255,0) 80%);
    clip-path: polygon(62.4% 35.4%, 83.9% 46.4%, 70.3% 83%, 42% 64.5%); filter: blur(6px); animation: beam 7s ease-in-out infinite; }
  @keyframes beam { 0%, 100% { opacity: .45; } 50% { opacity: .8; } }

  /* ---------- 成品参考 ---------- */
  #ref { position: fixed; inset: 0; background: rgba(30,45,60,.55); display: none; align-items: center; justify-content: center; z-index: 2000; }
  #ref.show { display: flex; }
  .refBox { background: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 30px 60px rgba(0,0,0,.35); width: min(900px, 90vw); animation: pop .25s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }
  .refBox h2 { margin: 0 0 10px; font: 24px var(--display); font-weight: normal; color: #35506e; display: flex; align-items: center; gap: 10px; }
  .refBox h2 small { font: 14px var(--display); color: #7d97b0; flex: 1; }
  #refScene { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1536 / 1024; }
  #refScene > img.bg { width: 100%; height: 100%; display: block; }
  .refstk { position: absolute; filter: drop-shadow(0 2px 2px rgba(40,60,80,.2)); }
  .refActs { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }

  #done { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 1500;
    background: #fffaf1; border-radius: 22px; padding: 18px 32px; font: 30px var(--display); color: #e0795e;
    box-shadow: 0 0 0 6px #fff, 0 0 0 7.5px #d8d0c4, 0 20px 40px rgba(0,0,0,.2); transition: opacity .3s, transform .3s cubic-bezier(.2,1.5,.4,1); }
  #done.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #done small { display: block; font-size: 16px; color: #6a86a3; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <div id="cardCol">
    <div class="hanger"></div>
    <div id="card">
      <div id="scene">
        <img class="bg" src="assets/backdrop.jpg" alt="温泉场景卡">
        <div id="snow"></div>
        <div id="sunbeam"></div>
      </div>
      <div class="label">
        <h1>3D造景贴纸 · <b>水豚温泉</b></h1>
        <p>从右边的贴纸页撕下来，贴到场景卡上</p>
      </div>
    </div>
    <div class="toolbar">
      <span id="count">已贴 0 / 32</span>
      <button class="tb" id="btnRef">看成品</button>
      <button class="tb" id="btnClear">全部撕掉重来</button>
      <button class="tb" id="btnMute">声音：开</button>
    </div>
  </div>
  <div id="sheet">
    <div class="sheetHd">
      <button class="arrow" id="prev" title="上一页">‹</button>
      <b><small>贴纸页</small><span id="pageName"></span></b>
      <button class="arrow" id="next" title="下一页">›</button>
    </div>
    <div id="slots"></div>
    <div id="pageDots"></div>
  </div>
</div>
<div id="hand"></div>
<div id="ref">
  <div class="refBox">
    <h2>成品参考<small>照着贴，或者随你摆</small><button class="tb" data-close>关闭</button></h2>
    <div id="refScene"><img class="bg" src="assets/backdrop.jpg" alt=""></div>
    <div class="refActs"><button class="tb main" id="btnApply">照这个一键贴好</button></div>
  </div>
</div>
<div id="done">全部贴好啦！<small>32 张贴纸都用上了</small></div>
<script src="assets/stickers.js"></script>
<script src="js/audio.js"></script>
<script>
  // 窗外的雪：只在玻璃那块平行四边形里下
  (function () {
    const box = document.getElementById('snow'), CW = 1536, CH = 1024, pct = (v, t) => (v / t * 100) + '%';
    const x0 = 958, y0 = 142, x1 = 1288, y1 = 475;
    box.style.left = pct(x0, CW); box.style.top = pct(y0, CH); box.style.width = pct(x1 - x0, CW); box.style.height = pct(y1 - y0, CH);
    box.style.clipPath = 'polygon(0 0, 100% 38.4%, 100% 100%, 0 66%)';
    for (let n = 0; n < 46; n++) {
      const f = document.createElement('i'), s = 2 + Math.random() * 3;
      f.style.left = (Math.random() * 100).toFixed(1) + '%'; f.style.width = f.style.height = s.toFixed(1) + 'px';
      f.style.opacity = (0.55 + Math.random() * 0.45).toFixed(2);
      f.style.setProperty('--t', (6 + Math.random() * 6).toFixed(1) + 's');
      f.style.setProperty('--sd', (-Math.random() * 12).toFixed(1) + 's');
      f.style.setProperty('--dx', (-10 - Math.random() * 30).toFixed(0) + 'px');
      box.appendChild(f);
    }
  })();
</script>
<script src="js/diy.js"></script>
</body>
</html>
